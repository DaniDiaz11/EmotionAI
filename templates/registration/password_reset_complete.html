<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>EmotionAI — Contraseña actualizada</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex; justify-content: center;
      align-items: center; min-height: 100vh; padding: 20px;
    }
    .card {
      width: 100%; max-width: 400px; background: white;
      border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      overflow: hidden;
    }
    .card-header {
      background: #2E4A6E; color: white;
      padding: 24px; text-align: center;
    }
    .card-header h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
    .card-body { padding: 36px 24px; text-align: center; }
    .icono { font-size: 48px; margin-bottom: 16px; }
    h2 { font-size: 18px; color: #2E4A6E; margin-bottom: 12px; }
    p { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 24px; }
    a {
      display: inline-block; padding: 12px 24px;
      background: #2E4A6E; color: white;
      text-decoration: none; border-radius: 12px;
      font-size: 14px; font-weight: 600;
    }
    a:hover { background: #1F3A5F; }
  </style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <h1>EmotionAI</h1>
  </div>
  <div class="card-body">
    <div class="icono">✅</div>
    <h2>¡Contraseña actualizada!</h2>
    <p>Tu contraseña fue cambiada exitosamente. Ya puedes iniciar sesión.</p>
    <a href="/login/">Ir al login</a>
  </div>
</div>
</body>
</html>
